---
- name: Install workstation packages
  become: true
  ansible.builtin.apt:
    name:
      - bear
      - build-essential
      - ccache
      - clang
      - clang-format
      - clang-tidy
      - clangd
      - cmake
      - curl
      - fd-find
      - gdb
      - git
      - jq
      - lldb
      - make
      - ninja-build
      - pipx
      - python3-pip
      - python3-venv
      - ripgrep
      - shellcheck
      - shfmt
      - sqlite3
      - tmux
      - trash-cli
      - unzip
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install graphical workstation packages
  become: true
  ansible.builtin.apt:
    name:
      - desktop-file-utils
      - patchelf
      - vulkan-tools
      - xclip
      - xvfb
    state: present
  when: workstation_gui_enabled | bool

- name: Download Neovim
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/nvim-linux-x86_64.tar.gz"
    dest: "/var/tmp/nvim-{{ neovim_version }}.tar.gz"
    checksum: "sha256:{{ neovim_archive_sha256 }}"
    mode: "0644"

- name: Create versioned Neovim installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/nvim-{{ neovim_version }}"
    state: directory
    mode: "0755"

- name: Install Neovim
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/nvim-{{ neovim_version }}.tar.gz"
    dest: "/opt/nvim-{{ neovim_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/opt/nvim-{{ neovim_version }}/bin/nvim"

- name: Link Neovim into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/nvim-{{ neovim_version }}/bin/nvim"
    dest: /usr/local/bin/nvim
    state: link
    force: true

- name: Install chezmoi
  become: true
  ansible.builtin.get_url:
    url: "https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/chezmoi-linux-amd64"
    dest: /usr/local/bin/chezmoi
    checksum: "sha256:{{ chezmoi_binary_sha256 }}"
    mode: "0755"

- name: Download Node.js
  become: true
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ nodejs_version }}/node-v{{ nodejs_version }}-linux-x64.tar.xz"
    dest: "/var/tmp/node-{{ nodejs_version }}.tar.xz"
    checksum: "sha256:{{ nodejs_archive_sha256 }}"
    mode: "0644"

- name: Create versioned Node.js installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/node-{{ nodejs_version }}"
    state: directory
    mode: "0755"

- name: Install Node.js
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/node-{{ nodejs_version }}.tar.xz"
    dest: "/opt/node-{{ nodejs_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/opt/node-{{ nodejs_version }}/bin/node"

- name: Link Node.js tools into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/node-{{ nodejs_version }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - corepack
    - node
    - npm
    - npx

- name: Create graphical application directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/applications
    - /usr/local/share/icons/hicolor/512x512/apps
    - /usr/local/share/icons/hicolor/scalable/apps
  when: workstation_gui_enabled | bool

- name: Install Zed graphical editor
  when: workstation_gui_enabled | bool
  block:
    - name: Download Zed
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/zed-industries/zed/releases/download/v{{ zed_version }}/zed-linux-x86_64.tar.gz"
        dest: "/var/tmp/zed-{{ zed_version }}.tar.gz"
        checksum: "sha256:{{ zed_archive_sha256 }}"
        mode: "0644"

    - name: Create versioned Zed installation directory
      become: true
      ansible.builtin.file:
        path: "/opt/zed-{{ zed_version }}"
        state: directory
        mode: "0755"

    - name: Install Zed
      become: true
      ansible.builtin.unarchive:
        src: "/var/tmp/zed-{{ zed_version }}.tar.gz"
        dest: "/opt/zed-{{ zed_version }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "/opt/zed-{{ zed_version }}/bin/zed"

    - name: Read the Zed editor runtime path
      ansible.builtin.command:
        argv:
          - patchelf
          - --print-rpath
          - "/opt/zed-{{ zed_version }}/libexec/zed-editor"
      register: workstation_zed_rpath
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Keep Zed graphics libraries vendor-neutral
      become: true
      ansible.builtin.command:
        argv:
          - patchelf
          - --set-rpath
          - $ORIGIN/../lib
          - "/opt/zed-{{ zed_version }}/libexec/zed-editor"
      changed_when: true
      when: >-
        workstation_zed_rpath.rc != 0 or
        workstation_zed_rpath.stdout != '$ORIGIN/../lib'

    - name: Link Zed into PATH
      become: true
      ansible.builtin.file:
        src: "/opt/zed-{{ zed_version }}/bin/zed"
        dest: /usr/local/bin/zed
        state: link
        force: true

    - name: Install the Zed desktop launcher
      become: true
      ansible.builtin.copy:
        src: dev.zed.Zed.desktop
        dest: /usr/local/share/applications/dev.zed.Zed.desktop
        mode: "0644"
      notify: Refresh desktop application database

    - name: Install the Zed application icon
      become: true
      ansible.builtin.copy:
        src: "/opt/zed-{{ zed_version }}/share/icons/hicolor/512x512/apps/zed.png"
        dest: /usr/local/share/icons/hicolor/512x512/apps/zed.png
        remote_src: true
        mode: "0644"

- name: Install Neovide graphical editor
  when: workstation_gui_enabled | bool
  block:
    - name: Download Neovide
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/neovide/neovide/releases/download/{{ neovide_version }}/neovide-linux-x86_64.tar"
        dest: "/var/tmp/neovide-{{ neovide_version }}.tar"
        checksum: "sha256:{{ neovide_archive_sha256 }}"
        mode: "0644"

    - name: Create versioned Neovide installation directory
      become: true
      ansible.builtin.file:
        path: "/opt/neovide-{{ neovide_version }}"
        state: directory
        mode: "0755"

    - name: Install Neovide
      become: true
      ansible.builtin.unarchive:
        src: "/var/tmp/neovide-{{ neovide_version }}.tar"
        dest: "/opt/neovide-{{ neovide_version }}"
        remote_src: true
        creates: "/opt/neovide-{{ neovide_version }}/neovide"

    - name: Link Neovide into PATH
      become: true
      ansible.builtin.file:
        src: "/opt/neovide-{{ neovide_version }}/neovide"
        dest: /usr/local/bin/neovide
        state: link
        force: true

    - name: Install the Neovide desktop launcher
      become: true
      ansible.builtin.copy:
        src: neovide.desktop
        dest: /usr/local/share/applications/neovide.desktop
        mode: "0644"
      notify: Refresh desktop application database

    - name: Install the Neovide application icon
      become: true
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/neovide/neovide/{{ neovide_version }}/assets/neovide.svg"
        dest: /usr/local/share/icons/hicolor/scalable/apps/neovide.svg
        checksum: "sha256:{{ neovide_icon_sha256 }}"
        mode: "0644"

- name: Check graphical workstation Vulkan support
  ansible.builtin.command:
    argv:
      - vulkaninfo
      - --summary
  register: workstation_vulkan
  changed_when: false
  failed_when: false
  check_mode: false
  when: workstation_gui_enabled | bool

- name: Report unavailable Vulkan support
  ansible.builtin.debug:
    msg: >-
      Vulkan is unavailable. Install a Vulkan-capable AMD, Intel, or NVIDIA
      driver before launching Zed. Headless hosts should set
      workstation_gui_enabled=false and use Zed Remote Development instead.
  when:
    - workstation_gui_enabled | bool
    - workstation_vulkan.rc != 0

- name: Check the versioned Tree-sitter CLI
  ansible.builtin.command:
    argv:
      - "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}/bin/tree-sitter"
      - --version
  register: workstation_tree_sitter_cli
  changed_when: false
  failed_when: false
  check_mode: false

- name: Build a host-compatible Tree-sitter CLI
  when: >-
    workstation_tree_sitter_cli.rc != 0 or
    ('tree-sitter ' ~ tree_sitter_cli_version) not in workstation_tree_sitter_cli.stdout
  block:
    - name: Download rustup-init for the Tree-sitter build
      become: true
      ansible.builtin.get_url:
        url: >-
          https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/x86_64-unknown-linux-gnu/rustup-init
        dest: "/var/tmp/rustup-init-{{ rustup_version }}"
        checksum: "sha256:{{ rustup_init_sha256 }}"
        mode: "0755"

    - name: Remove an unusable Tree-sitter CLI installation
      become: true
      ansible.builtin.file:
        path: "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}"
        state: absent

    - name: Install the temporary Rust build toolchain
      become: true
      ansible.builtin.command:
        argv:
          - "/var/tmp/rustup-init-{{ rustup_version }}"
          - --default-toolchain
          - "{{ tree_sitter_rust_version }}"
          - --profile
          - minimal
          - --no-modify-path
          - -y
      environment:
        CARGO_HOME: /var/tmp/tree-sitter-build/cargo
        RUSTUP_HOME: /var/tmp/tree-sitter-build/rustup
      changed_when: true

    - name: Compile and install Tree-sitter CLI
      become: true
      ansible.builtin.command:
        argv:
          - /var/tmp/tree-sitter-build/cargo/bin/cargo
          - install
          - --locked
          - --version
          - "{{ tree_sitter_cli_version }}"
          - --root
          - "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}"
          - tree-sitter-cli
      environment:
        CARGO_HOME: /var/tmp/tree-sitter-build/cargo
        RUSTUP_HOME: /var/tmp/tree-sitter-build/rustup
      changed_when: true
  always:
    - name: Remove the temporary Rust build toolchain
      become: true
      ansible.builtin.file:
        path: /var/tmp/tree-sitter-build
        state: absent

- name: Link Tree-sitter CLI into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}/bin/tree-sitter"
    dest: /usr/local/bin/tree-sitter
    state: link
    force: true

- name: Download neocmakelsp
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/neocmakelsp/neocmakelsp/releases/download/v{{ neocmakelsp_version }}/neocmakelsp-x86_64-unknown-linux-gnu.tar.gz
    dest: "/var/tmp/neocmakelsp-{{ neocmakelsp_version }}.tar.gz"
    checksum: "sha256:{{ neocmakelsp_archive_sha256 }}"
    mode: "0644"

- name: Create versioned neocmakelsp installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/neocmakelsp-{{ neocmakelsp_version }}"
    state: directory
    mode: "0755"

- name: Install neocmakelsp
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/neocmakelsp-{{ neocmakelsp_version }}.tar.gz"
    dest: "/opt/neocmakelsp-{{ neocmakelsp_version }}"
    remote_src: true
    creates: "/opt/neocmakelsp-{{ neocmakelsp_version }}/neocmakelsp"

- name: Link neocmakelsp into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/neocmakelsp-{{ neocmakelsp_version }}/neocmakelsp"
    dest: /usr/local/bin/neocmakelsp
    state: link
    force: true

- name: Install pinned npm language servers
  become: true
  community.general.npm:
    executable: /usr/local/bin/npm
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
  environment:
    NPM_CONFIG_PREFIX: /usr/local
    PATH: /usr/local/bin:/usr/bin:/bin
  loop: "{{ npm_language_servers }}"

- name: Install pinned Python developer tools for the workstation user
  ansible.builtin.pip:
    name: "{{ python_developer_packages }}"
    extra_args: --user
    state: present

- name: Check the configured Qt qmake
  ansible.builtin.stat:
    path: "{{ qt_qmake_path }}"
  register: workstation_qt_qmake

- name: Report missing external Qt SDK
  ansible.builtin.debug:
    msg: >-
      Qt qmake was not found at {{ qt_qmake_path }}. Install the project Qt 5.15
      SDK separately or override qt_qmake_path before using qmake-workflow.
  when: not (workstation_qt_qmake.stat.executable | default(false))

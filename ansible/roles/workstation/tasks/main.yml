---
- name: Require a supported workstation platform
  ansible.builtin.assert:
    that:
      - >-
        (ansible_distribution == "Ubuntu" and ansible_architecture == "x86_64") or
        (ansible_os_family == "Debian" and
         ansible_distribution_major_version == "12" and
         ansible_architecture == "aarch64")
    fail_msg: >-
      Supported platforms are Ubuntu x86_64 and headless Debian 12 aarch64.

- name: Restrict graphical provisioning to Ubuntu x86_64
  ansible.builtin.assert:
    that:
      - not (workstation_gui_enabled | bool) or ansible_distribution == "Ubuntu"
      - not (workstation_gui_enabled | bool) or ansible_architecture == "x86_64"
    fail_msg: Graphical provisioning is supported only on Ubuntu x86_64.

- name: Select architecture-specific workstation assets
  ansible.builtin.set_fact:
    workstation_architecture_assets: "{{ workstation_asset_matrix[ansible_architecture] }}"
    workstation_java_major: "{{ (java_runtime_version | split('.')) | first }}"

- name: Resolve versioned workstation asset names
  ansible.builtin.set_fact:
    workstation_neovim_asset: "nvim-linux-{{ workstation_architecture_assets.neovim_arch }}.tar.gz"
    workstation_chezmoi_asset: >-
      chezmoi_{{ chezmoi_version }}_linux_{{ workstation_architecture_assets.chezmoi_arch }}.tar.gz
    workstation_nodejs_asset: >-
      node-v{{ nodejs_version }}-linux-{{ workstation_architecture_assets.nodejs_arch }}.tar.xz
    workstation_neocmakelsp_asset: >-
      neocmakelsp-{{ workstation_architecture_assets.rust_target }}.tar.gz
    workstation_lua_ls_asset: >-
      lua-language-server-{{ lua_language_server_version }}-linux-{{ workstation_architecture_assets.lua_ls_arch }}.tar.gz
    workstation_qmlls_asset: >-
      qmllanguageserver-linux-{{ workstation_architecture_assets.qmlls_arch }}-{{ qmlls_version }}.zip
    workstation_java_repository: "temurin{{ workstation_java_major }}-binaries"
    workstation_java_release_tag: "jdk-{{ java_runtime_version | replace('_', '%2B') }}"
    workstation_java_asset: >-
      OpenJDK{{ workstation_java_major }}U-jre_{{ workstation_architecture_assets.java_arch }}_linux_hotspot_{{ java_runtime_version }}.tar.gz
    workstation_pkl_asset: "pkl-linux-{{ workstation_architecture_assets.pkl_arch }}"

- name: Install workstation packages
  become: true
  ansible.builtin.apt:
    name:
      - bear
      - build-essential
      - ccache
      - clang
      - clang-format
      - clang-tidy
      - clangd
      - cmake
      - curl
      - fd-find
      - gdb
      - git
      - jq
      - lldb
      - make
      - ninja-build
      - pipx
      - python3-pip
      - python3-venv
      - ripgrep
      - shellcheck
      - shfmt
      - sqlite3
      - tmux
      - trash-cli
      - unzip
      - xvfb
      - xz-utils
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install graphical workstation packages
  become: true
  ansible.builtin.apt:
    name:
      - desktop-file-utils
      - patchelf
      - vulkan-tools
      - xclip
    state: present
  when: workstation_gui_enabled | bool

- name: Download Neovim
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/neovim/neovim/releases/download/v{{ neovim_version }}/{{ workstation_neovim_asset }}
    dest: "/var/tmp/nvim-{{ neovim_version }}.tar.gz"
    checksum: "sha256:{{ workstation_architecture_assets.neovim_sha256 }}"
    mode: "0644"

- name: Create versioned Neovim installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/nvim-{{ neovim_version }}"
    state: directory
    mode: "0755"

- name: Install Neovim
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/nvim-{{ neovim_version }}.tar.gz"
    dest: "/opt/nvim-{{ neovim_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/opt/nvim-{{ neovim_version }}/bin/nvim"

- name: Link Neovim into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/nvim-{{ neovim_version }}/bin/nvim"
    dest: /usr/local/bin/nvim
    state: link
    force: true

- name: Download chezmoi
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/twpayne/chezmoi/releases/download/v{{ chezmoi_version }}/{{ workstation_chezmoi_asset }}
    dest: "/var/tmp/{{ workstation_chezmoi_asset }}"
    checksum: "sha256:{{ workstation_architecture_assets.chezmoi_sha256 }}"
    mode: "0644"

- name: Create versioned chezmoi installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/chezmoi-{{ chezmoi_version }}"
    state: directory
    mode: "0755"

- name: Check the downloaded chezmoi archive
  ansible.builtin.stat:
    path: "/var/tmp/{{ workstation_chezmoi_asset }}"
  register: workstation_chezmoi_archive

- name: Install chezmoi
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/{{ workstation_chezmoi_asset }}"
    dest: "/opt/chezmoi-{{ chezmoi_version }}"
    remote_src: true
    creates: "/opt/chezmoi-{{ chezmoi_version }}/chezmoi"
  when: not ansible_check_mode or workstation_chezmoi_archive.stat.exists

- name: Link chezmoi into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/chezmoi-{{ chezmoi_version }}/chezmoi"
    dest: /usr/local/bin/chezmoi
    state: link
    force: true

- name: Download Node.js
  become: true
  ansible.builtin.get_url:
    url: "https://nodejs.org/dist/v{{ nodejs_version }}/{{ workstation_nodejs_asset }}"
    dest: "/var/tmp/{{ workstation_nodejs_asset }}"
    checksum: "sha256:{{ workstation_architecture_assets.nodejs_sha256 }}"
    mode: "0644"

- name: Create versioned Node.js installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/node-{{ nodejs_version }}"
    state: directory
    mode: "0755"

- name: Check the downloaded Node.js archive
  ansible.builtin.stat:
    path: "/var/tmp/{{ workstation_nodejs_asset }}"
  register: workstation_nodejs_archive

- name: Install Node.js
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/{{ workstation_nodejs_asset }}"
    dest: "/opt/node-{{ nodejs_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/opt/node-{{ nodejs_version }}/bin/node"
  when: not ansible_check_mode or workstation_nodejs_archive.stat.exists

- name: Link Node.js tools into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/node-{{ nodejs_version }}/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - corepack
    - node
    - npm
    - npx

- name: Create graphical application directories
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /usr/local/share/applications
    - /usr/local/share/icons/hicolor/512x512/apps
    - /usr/local/share/icons/hicolor/scalable/apps
  when: workstation_gui_enabled | bool

- name: Install Zed graphical editor
  when: workstation_gui_enabled | bool
  block:
    - name: Download Zed
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/zed-industries/zed/releases/download/v{{ zed_version }}/zed-linux-x86_64.tar.gz"
        dest: "/var/tmp/zed-{{ zed_version }}.tar.gz"
        checksum: "sha256:{{ zed_archive_sha256 }}"
        mode: "0644"

    - name: Create versioned Zed installation directory
      become: true
      ansible.builtin.file:
        path: "/opt/zed-{{ zed_version }}"
        state: directory
        mode: "0755"

    - name: Install Zed
      become: true
      ansible.builtin.unarchive:
        src: "/var/tmp/zed-{{ zed_version }}.tar.gz"
        dest: "/opt/zed-{{ zed_version }}"
        remote_src: true
        extra_opts:
          - --strip-components=1
        creates: "/opt/zed-{{ zed_version }}/bin/zed"

    - name: Read the Zed editor runtime path
      ansible.builtin.command:
        argv:
          - patchelf
          - --print-rpath
          - "/opt/zed-{{ zed_version }}/libexec/zed-editor"
      register: workstation_zed_rpath
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Keep Zed graphics libraries vendor-neutral
      become: true
      ansible.builtin.command:
        argv:
          - patchelf
          - --set-rpath
          - $ORIGIN/../lib
          - "/opt/zed-{{ zed_version }}/libexec/zed-editor"
      changed_when: true
      when: >-
        workstation_zed_rpath.rc != 0 or
        workstation_zed_rpath.stdout != '$ORIGIN/../lib'

    - name: Link Zed into PATH
      become: true
      ansible.builtin.file:
        src: "/opt/zed-{{ zed_version }}/bin/zed"
        dest: /usr/local/bin/zed
        state: link
        force: true

    - name: Install the Zed desktop launcher
      become: true
      ansible.builtin.copy:
        src: dev.zed.Zed.desktop
        dest: /usr/local/share/applications/dev.zed.Zed.desktop
        mode: "0644"
      notify: Refresh desktop application database

    - name: Install the Zed application icon
      become: true
      ansible.builtin.copy:
        src: "/opt/zed-{{ zed_version }}/share/icons/hicolor/512x512/apps/zed.png"
        dest: /usr/local/share/icons/hicolor/512x512/apps/zed.png
        remote_src: true
        mode: "0644"

- name: Install Neovide graphical editor
  when: workstation_gui_enabled | bool
  block:
    - name: Download Neovide
      become: true
      ansible.builtin.get_url:
        url: "https://github.com/neovide/neovide/releases/download/{{ neovide_version }}/neovide-linux-x86_64.tar"
        dest: "/var/tmp/neovide-{{ neovide_version }}.tar"
        checksum: "sha256:{{ neovide_archive_sha256 }}"
        mode: "0644"

    - name: Create versioned Neovide installation directory
      become: true
      ansible.builtin.file:
        path: "/opt/neovide-{{ neovide_version }}"
        state: directory
        mode: "0755"

    - name: Install Neovide
      become: true
      ansible.builtin.unarchive:
        src: "/var/tmp/neovide-{{ neovide_version }}.tar"
        dest: "/opt/neovide-{{ neovide_version }}"
        remote_src: true
        creates: "/opt/neovide-{{ neovide_version }}/neovide"

    - name: Link Neovide into PATH
      become: true
      ansible.builtin.file:
        src: "/opt/neovide-{{ neovide_version }}/neovide"
        dest: /usr/local/bin/neovide
        state: link
        force: true

    - name: Install the Neovide desktop launcher
      become: true
      ansible.builtin.copy:
        src: neovide.desktop
        dest: /usr/local/share/applications/neovide.desktop
        mode: "0644"
      notify: Refresh desktop application database

    - name: Install the Neovide application icon
      become: true
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/neovide/neovide/{{ neovide_version }}/assets/neovide.svg"
        dest: /usr/local/share/icons/hicolor/scalable/apps/neovide.svg
        checksum: "sha256:{{ neovide_icon_sha256 }}"
        mode: "0644"

- name: Check graphical workstation Vulkan support
  ansible.builtin.command:
    argv:
      - vulkaninfo
      - --summary
  register: workstation_vulkan
  changed_when: false
  failed_when: false
  check_mode: false
  when: workstation_gui_enabled | bool

- name: Report unavailable Vulkan support
  ansible.builtin.debug:
    msg: >-
      Vulkan is unavailable. Install a Vulkan-capable AMD, Intel, or NVIDIA
      driver before launching Zed. Headless hosts should set
      workstation_gui_enabled=false and use Zed Remote Development instead.
  when:
    - workstation_gui_enabled | bool
    - workstation_vulkan.rc != 0

- name: Check the versioned Tree-sitter CLI
  ansible.builtin.command:
    argv:
      - "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}/bin/tree-sitter"
      - --version
  register: workstation_tree_sitter_cli
  changed_when: false
  failed_when: false
  check_mode: false

- name: Download rustup-init
  become: true
  ansible.builtin.get_url:
    url: >-
      https://static.rust-lang.org/rustup/archive/{{ rustup_version }}/{{ workstation_architecture_assets.rust_target }}/rustup-init
    dest: "/var/tmp/rustup-init-{{ rustup_version }}"
    checksum: "sha256:{{ workstation_architecture_assets.rustup_sha256 }}"
    mode: "0755"

- name: Build a host-compatible Tree-sitter CLI
  when: >-
    workstation_tree_sitter_cli.rc != 0 or
    ('tree-sitter ' ~ tree_sitter_cli_version) not in workstation_tree_sitter_cli.stdout
  block:
    - name: Remove an unusable Tree-sitter CLI installation
      become: true
      ansible.builtin.file:
        path: "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}"
        state: absent

    - name: Install the temporary Rust build toolchain
      become: true
      ansible.builtin.command:
        argv:
          - "/var/tmp/rustup-init-{{ rustup_version }}"
          - --default-toolchain
          - "{{ tree_sitter_rust_version }}"
          - --profile
          - minimal
          - --no-modify-path
          - -y
      environment:
        CARGO_HOME: /var/tmp/tree-sitter-build/cargo
        RUSTUP_HOME: /var/tmp/tree-sitter-build/rustup
      changed_when: true

    - name: Compile and install Tree-sitter CLI
      become: true
      ansible.builtin.command:
        argv:
          - /var/tmp/tree-sitter-build/cargo/bin/cargo
          - install
          - --locked
          - --version
          - "{{ tree_sitter_cli_version }}"
          - --root
          - "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}"
          - tree-sitter-cli
      environment:
        CARGO_HOME: /var/tmp/tree-sitter-build/cargo
        RUSTUP_HOME: /var/tmp/tree-sitter-build/rustup
      changed_when: true
  always:
    - name: Remove the temporary Rust build toolchain
      become: true
      ansible.builtin.file:
        path: /var/tmp/tree-sitter-build
        state: absent

- name: Install the user Rust toolchain
  ansible.builtin.command:
    argv:
      - "/var/tmp/rustup-init-{{ rustup_version }}"
      - --default-toolchain
      - "{{ rust_toolchain_version }}"
      - --profile
      - default
      - --no-modify-path
      - -y
    creates: >-
      {{ ansible_env.HOME }}/.rustup/toolchains/{{ rust_toolchain_version }}-{{ workstation_architecture_assets.rust_target }}
  environment:
    CARGO_HOME: "{{ ansible_env.HOME }}/.cargo"
    RUSTUP_HOME: "{{ ansible_env.HOME }}/.rustup"

- name: Check the Rust analyzer component
  ansible.builtin.stat:
    path: >-
      {{ ansible_env.HOME }}/.rustup/toolchains/{{ rust_toolchain_version }}-{{ workstation_architecture_assets.rust_target }}/bin/rust-analyzer
  register: workstation_rust_analyzer

- name: Install the Rust analyzer component
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/.cargo/bin/rustup"
      - component
      - add
      - rust-analyzer
      - --toolchain
      - "{{ rust_toolchain_version }}"
  environment:
    CARGO_HOME: "{{ ansible_env.HOME }}/.cargo"
    RUSTUP_HOME: "{{ ansible_env.HOME }}/.rustup"
  changed_when: true
  when: not workstation_rust_analyzer.stat.exists

- name: Link Rust developer tools into PATH
  become: true
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.cargo/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - cargo
    - cargo-clippy
    - cargo-fmt
    - clippy-driver
    - rust-analyzer
    - rustc
    - rustfmt

- name: Link Tree-sitter CLI into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/tree-sitter-cli-{{ tree_sitter_cli_version }}/bin/tree-sitter"
    dest: /usr/local/bin/tree-sitter
    state: link
    force: true

- name: Download neocmakelsp
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/neocmakelsp/neocmakelsp/releases/download/v{{ neocmakelsp_version }}/{{ workstation_neocmakelsp_asset }}
    dest: "/var/tmp/neocmakelsp-{{ neocmakelsp_version }}.tar.gz"
    checksum: "sha256:{{ workstation_architecture_assets.neocmakelsp_sha256 }}"
    mode: "0644"

- name: Create versioned neocmakelsp installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/neocmakelsp-{{ neocmakelsp_version }}"
    state: directory
    mode: "0755"

- name: Install neocmakelsp
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/neocmakelsp-{{ neocmakelsp_version }}.tar.gz"
    dest: "/opt/neocmakelsp-{{ neocmakelsp_version }}"
    remote_src: true
    creates: "/opt/neocmakelsp-{{ neocmakelsp_version }}/neocmakelsp"

- name: Link neocmakelsp into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/neocmakelsp-{{ neocmakelsp_version }}/neocmakelsp"
    dest: /usr/local/bin/neocmakelsp
    state: link
    force: true

- name: Download Lua language server
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/LuaLS/lua-language-server/releases/download/{{ lua_language_server_version }}/{{ workstation_lua_ls_asset }}
    dest: "/var/tmp/lua-language-server-{{ lua_language_server_version }}.tar.gz"
    checksum: "sha256:{{ workstation_architecture_assets.lua_ls_sha256 }}"
    mode: "0644"

- name: Create the Lua language server directory
  become: true
  ansible.builtin.file:
    path: "/opt/lua-language-server-{{ lua_language_server_version }}"
    state: directory
    mode: "0755"

- name: Install Lua language server
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/lua-language-server-{{ lua_language_server_version }}.tar.gz"
    dest: "/opt/lua-language-server-{{ lua_language_server_version }}"
    remote_src: true
    creates: "/opt/lua-language-server-{{ lua_language_server_version }}/bin/lua-language-server"

- name: Link Lua language server into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/lua-language-server-{{ lua_language_server_version }}/bin/lua-language-server"
    dest: /usr/local/bin/lua-language-server
    state: link
    force: true

- name: Download QML language server
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/TheQtCompanyRnD/qmlls-workflow/releases/download/{{ qmlls_version }}/{{ workstation_qmlls_asset }}
    dest: "/var/tmp/qmlls-{{ qmlls_version }}.zip"
    checksum: "sha256:{{ workstation_architecture_assets.qmlls_sha256 }}"
    mode: "0644"

- name: Create the QML language server directory
  become: true
  ansible.builtin.file:
    path: "/opt/qmlls-{{ qmlls_version }}"
    state: directory
    mode: "0755"

- name: Install QML language server
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/qmlls-{{ qmlls_version }}.zip"
    dest: "/opt/qmlls-{{ qmlls_version }}"
    remote_src: true
    creates: "/opt/qmlls-{{ qmlls_version }}/qmlls"

- name: Link QML language server into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/qmlls-{{ qmlls_version }}/qmlls"
    dest: /usr/local/bin/qmlls
    state: link
    force: true

- name: Download Java runtime for Pkl language tooling
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/adoptium/{{ workstation_java_repository }}/releases/download/{{ workstation_java_release_tag }}/{{ workstation_java_asset }}
    dest: "/var/tmp/temurin-jre-{{ java_runtime_version }}.tar.gz"
    checksum: "sha256:{{ workstation_architecture_assets.java_sha256 }}"
    mode: "0644"

- name: Create the Java runtime directory
  become: true
  ansible.builtin.file:
    path: "/opt/temurin-jre-{{ java_runtime_version }}"
    state: directory
    mode: "0755"

- name: Install Java runtime for Pkl language tooling
  become: true
  ansible.builtin.unarchive:
    src: "/var/tmp/temurin-jre-{{ java_runtime_version }}.tar.gz"
    dest: "/opt/temurin-jre-{{ java_runtime_version }}"
    remote_src: true
    extra_opts:
      - --strip-components=1
    creates: "/opt/temurin-jre-{{ java_runtime_version }}/bin/java"

- name: Link the current Java runtime into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/temurin-jre-{{ java_runtime_version }}/bin/java"
    dest: /usr/local/bin/java
    state: link
    force: true

- name: Create the Pkl installation directory
  become: true
  ansible.builtin.file:
    path: "/opt/pkl-{{ pkl_version }}"
    state: directory
    mode: "0755"

- name: Install Pkl
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/apple/pkl/releases/download/{{ pkl_version }}/{{ workstation_pkl_asset }}
    dest: "/opt/pkl-{{ pkl_version }}/pkl"
    checksum: "sha256:{{ workstation_architecture_assets.pkl_sha256 }}"
    mode: "0755"

- name: Link Pkl into PATH
  become: true
  ansible.builtin.file:
    src: "/opt/pkl-{{ pkl_version }}/pkl"
    dest: /usr/local/bin/pkl
    state: link
    force: true

- name: Create the Pkl language server directory
  become: true
  ansible.builtin.file:
    path: "/opt/pkl-lsp-{{ pkl_lsp_version }}"
    state: directory
    mode: "0755"

- name: Install Pkl language server
  become: true
  ansible.builtin.get_url:
    url: >-
      https://github.com/apple/pkl-lsp/releases/download/{{ pkl_lsp_version }}/pkl-lsp-{{ pkl_lsp_version }}.jar
    dest: "/opt/pkl-lsp-{{ pkl_lsp_version }}/pkl-lsp.jar"
    checksum: "sha256:{{ pkl_lsp_jar_sha256 }}"
    mode: "0644"

- name: Install the Pkl language server launcher
  become: true
  ansible.builtin.copy:
    dest: /usr/local/bin/pkl-lsp
    mode: "0755"
    content: |
      #!/bin/sh
      exec /opt/temurin-jre-{{ java_runtime_version }}/bin/java -jar /opt/pkl-lsp-{{ pkl_lsp_version }}/pkl-lsp.jar "$@"

- name: Install pinned npm language servers
  become: true
  community.general.npm:
    executable: /usr/local/bin/npm
    name: "{{ item.name }}"
    version: "{{ item.version }}"
    global: true
    state: present
  environment:
    NPM_CONFIG_PREFIX: /usr/local
    PATH: /usr/local/bin:/usr/bin:/bin
  loop: "{{ npm_language_servers }}"

- name: Install pinned Python developer tools for the workstation user
  ansible.builtin.pip:
    name: "{{ python_developer_packages }}"
    virtualenv: "{{ ansible_env.HOME }}/.local/share/dotfiles/python-tools"
    virtualenv_command: /usr/bin/python3 -m venv
    state: present

- name: Remove legacy user-level Python tool launchers
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin/{{ item }}"
    state: absent
  loop:
    - basedpyright
    - basedpyright-langserver
    - debugpy
    - debugpy-adapter
    - ruff

- name: Link Python developer tools into PATH
  become: true
  ansible.builtin.file:
    src: "{{ ansible_env.HOME }}/.local/share/dotfiles/python-tools/bin/{{ item }}"
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true
  loop:
    - basedpyright
    - basedpyright-langserver
    - debugpy
    - debugpy-adapter
    - ruff

- name: Check the configured Qt qmake
  ansible.builtin.stat:
    path: "{{ qt_qmake_path }}"
  register: workstation_qt_qmake

- name: Report missing external Qt SDK
  ansible.builtin.debug:
    msg: >-
      Qt qmake was not found at {{ qt_qmake_path }}. Install the project Qt 5.15
      SDK separately or override qt_qmake_path before using qmake-workflow.
  when: not (workstation_qt_qmake.stat.executable | default(false))
